name: Import compact listening player once
on:
  push:
    paths: ['.github/workflows/import-compact-player.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-verified player files
        env:
          IMPORT_PLAN: 
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          files = json.loads(gzip.decompress(base64.b64decode(os.environ['IMPORT_PLAN'])))
          for item in files:
              path = Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and not item['path'].startswith('.github/')
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              assert actual == item['base_sha256'], f'Concurrent change: {path}'
              data = base64.b64decode(item['content'])
              assert hashlib.sha256(data).hexdigest() == item['sha256']
          for item in files:
              path = Path(item['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(item['content']))
          print(f'Applied {len(files)} verified text files')
          PY
      - run: pip install -r requirements.txt
      - run: python scripts/project.py validate
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/collaboration.test.mjs
      - run: python scripts/project.py build
      - name: Commit validated changes
        run: |
          git add -- site-config.json .gitattributes README.md CONTRIBUTING.md catalog kb media/README.md scripts tests web
          python scripts/check_tracked_files.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Unify the player title and add seeking controls with timed lyrics"
          git push origin HEAD:main
