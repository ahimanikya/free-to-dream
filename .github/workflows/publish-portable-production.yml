name: Publish portable production once
on:
  push:
    paths: ['.github/workflows/publish-portable-production.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed portable project files
        env:
          UPDATE_PLAN: 
        run: |
          python - <<'PYCODE'
          import base64,gzip,hashlib,json,os,subprocess
          from pathlib import Path
          plan=json.loads(gzip.decompress(base64.b64decode(os.environ['UPDATE_PLAN'])))
          for item in plan['files']:
              p=Path(item['path'])
              assert not p.is_absolute() and '..' not in p.parts
              if item['base_sha256'] is None:
                  assert not p.exists(),f'Concurrent addition: {p}'
              else:
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==item['base_sha256'],f'Concurrent edit: {p}'
          for item in plan['files']:
              p=Path(item['path']);p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(item['content'],encoding='utf-8')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
          subprocess.run(['git','add','--',*[i['path'] for i in plan['files']]],check=True)
          print(f"Verified {len(plan['files'])} portable project files.")
          PYCODE
      - run: pip install -r requirements.txt
      - run: python scripts/check_portability.py
      - run: python skills/poetry-to-music/scripts/prepare_queue.py --repo .
      - run: python scripts/project.py validate
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/collaboration.test.mjs
      - run: python scripts/project.py build
      - name: Verify portable container from its checked-in definition
        run: |
          docker build -t free-to-dream-portable .devcontainer
          docker run --rm -v "$PWD:/workspace" -w /workspace free-to-dream-portable sh -ec 'python -m pip install -r requirements.txt; git lfs version; ffmpeg -version; node --version; python scripts/check_portability.py; python skills/poetry-to-music/scripts/prepare_queue.py --repo .; python scripts/project.py build'
      - name: Publish project knowledge and remove this one-time workflow
        run: |
          git rm .github/workflows/publish-portable-production.yml
          python scripts/check_tracked_files.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep production skill and knowledge portable in the repository'
          git push origin HEAD:main
