name: Publish musical rationale once
on:
  push:
    paths: ['.github/workflows/publish-musical-rationale.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed page updates with concurrent-edit protection
        env:
          UPDATE_PLAN: 
        run: |
          python - <<'PYCODE'
          import base64,gzip,hashlib,json,os,subprocess
          from pathlib import Path
          plan=json.loads(gzip.decompress(base64.b64decode(os.environ['UPDATE_PLAN'])))
          allowed={'scripts/project.py','tests/test_project.py','kb/guides/contributing.md'}
          for item in plan['files']:
              p=Path(item['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert item['path'] in allowed or (p.parent==Path('kb/poems/i-am-free-to-dream/languages') and p.suffix=='.md')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['base_sha256'],f'Concurrent edit: {p}'
          subprocess.run(['git','apply','--check','-'],input=plan['patch'],text=True,check=True)
          subprocess.run(['git','apply','-'],input=plan['patch'],text=True,check=True)
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual=={i['path'] for i in plan['files']}
          for item in plan['files']:
              assert hashlib.sha256(Path(item['path']).read_bytes()).hexdigest()==item['sha256']
          print(f"Verified {len(plan['files'])} updated files.")
          PYCODE
      - run: pip install -r requirements.txt
      - run: python scripts/project.py validate
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/collaboration.test.mjs
      - run: python scripts/project.py build
      - name: Publish reviewed text and remove this one-time workflow
        run: |
          rm .github/workflows/publish-musical-rationale.yml
          git add kb/poems/i-am-free-to-dream/languages kb/guides/contributing.md scripts/project.py tests/test_project.py .github/workflows/publish-musical-rationale.yml
          python scripts/check_tracked_files.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Explain musical choices and optional vocal variations for every language'
          git push origin HEAD:main
