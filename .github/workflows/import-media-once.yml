name: Import recording archive into Git LFS
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-recording-archive
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve checksum-verified archive and prepared changes
        shell: bash
        run: |
          python - <<'PY'
          import base64, concurrent.futures, hashlib, json, pathlib, shutil, urllib.request
          root=pathlib.Path.cwd().resolve()
          url='https://github.com/ahimanikya/free-to-dream/releases/download/media-archive-2026-09-23/import-plan-v2.json'
          with urllib.request.urlopen(url,timeout=90) as r: raw=r.read()
          assert hashlib.sha256(raw).hexdigest()=='f1a4f4231d438a5015f68519b72ba6510e661e858d9c2a96000efe3c90110f40'
          plan=json.loads(raw)
          def confined(name):
              p=(root/name).resolve()
              assert p.is_relative_to(root) and not name.startswith('.git/'),name
              return p
          # Check every baseline before writing any repository text.
          for f in plan['files']:
              p=confined(f['path'])
              if f['base_sha256'] is None: assert not p.exists(),f['path']
              else: assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==f['base_sha256'],f['path']
              assert hashlib.sha256(base64.b64decode(f['content'])).hexdigest()==f['sha256']
          for f in plan['files']:
              p=confined(f['path']); p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(base64.b64decode(f['content']))
          def download(a):
              p=confined(a['repo_path'])
              assert a['repo_path'].startswith('media/')
              assert a['download_url'].startswith('https://github.com/ahimanikya/free-to-dream/releases/download/')
              assert not p.exists(),a['repo_path']
              p.parent.mkdir(parents=True,exist_ok=True)
              with urllib.request.urlopen(a['download_url'],timeout=180) as r, p.open('wb') as out: shutil.copyfileobj(r,out)
              assert p.stat().st_size==a['bytes'],a['repo_path']
              with p.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
              assert digest==a['sha256'],a['repo_path']
              print('Verified',a['repo_path'],flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(download,plan['assets']))
          PY
      - name: Prepare and verify Git LFS objects
        run: |
          git lfs install --local
          git add .gitattributes .github/workflows/check.yml CONTRIBUTING.md README.md catalog kb/guides media scripts tests
          python scripts/check_tracked_files.py
          git lfs fsck
          git diff --cached --check
      - name: Validate collection and website
        run: |
          pip install -r requirements.txt
          python scripts/project.py validate
          python -m unittest discover -s tests -v
          node --test tests/collaboration.test.mjs
          python scripts/project.py build
      - name: Commit Git LFS archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Track complete recording archive with Git LFS'
          git lfs push origin HEAD
          git push origin HEAD:main
