name: Import Sambalpuri video and production workflow once
on:
  push:
    paths: ['.github/workflows/import-sambalpuri-video.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-verified media and collection updates
        env:
          IMPORT_PLAN: 
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,urllib.request,shutil
          from pathlib import Path
          plan=json.loads(gzip.decompress(base64.b64decode(os.environ['IMPORT_PLAN'])))
          for item in plan['files']:
              path=Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and not item['path'].startswith('.github/')
              actual=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              assert actual==item['base_sha256'],f'Concurrent change: {path}'
              assert hashlib.sha256(base64.b64decode(item['content'])).hexdigest()==item['sha256']
          for item in plan['assets']:
              path=Path(item['repo_path'])
              assert path.parent==Path('media/sambalpuri') and not path.exists()
              assert item['download_url'].startswith('https://github.com/ahimanikya/free-to-dream/releases/download/sambalpuri-2026-09-27/')
              path.parent.mkdir(parents=True,exist_ok=True)
              with urllib.request.urlopen(item['download_url'],timeout=180) as src,path.open('wb') as out: shutil.copyfileobj(src,out)
              assert path.stat().st_size==item['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256']
          for item in plan['files']:
              path=Path(item['path']);path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(base64.b64decode(item['content']))
          print('Verified Sambalpuri media and applied collection updates.')
          PY
      - run: pip install -r requirements.txt
      - run: python scripts/project.py validate
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/collaboration.test.mjs
      - run: python scripts/project.py build
      - name: Commit Sambalpuri files with Git LFS
        run: |
          git lfs install --local
          git add README.md catalog/recordings.json catalog/media-archive.json catalog/asset-inventory.json kb/log.md media/README.md media/sambalpuri kb/poems/i-am-free-to-dream/languages/sambalpuri.md
          python scripts/check_tracked_files.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish selected Sambalpuri duet and matching video'
      - name: Pin streaming URLs to the media commit
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          p=Path('catalog/recordings.json');items=json.loads(p.read_text())
          for item in items:
              if item['id'] in ('sambalpuri-audio-01','sambalpuri-video-01'):item['public_url']=f"https://media.githubusercontent.com/media/ahimanikya/free-to-dream/{sha}/{item['repo_path']}"
          p.write_text(json.dumps(items,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/project.py validate
          git add catalog/recordings.json
          git commit -m 'Pin Sambalpuri playback URLs to the verified media version'
          git lfs push origin HEAD
          git push origin HEAD:main
